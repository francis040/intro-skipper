name: Release Chinese localization
on:
  workflow_dispatch:
  push:
    tags: ['zh-CN-v*']
permissions:
  contents: write
concurrency:
  group: zh-CN-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    if: github.repository != 'intro-skipper/intro-skipper'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: intro-skipper-zh-CN
          path: package/release
      - name: Prepare release and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=$(python3 -c 'import json; print(json.load(open("localization-base.json"))["branch"])')
          VERSION=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("IntroSkipper/IntroSkipper.csproj").findtext(".//FileVersion"))')
          TAG="zh-CN-v${VERSION}"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Tag does not match assembly version'; exit 1
          fi
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git switch -C "$BRANCH" "$GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; published versions are immutable. Bump the version.'; exit 1
          fi
          ARCHIVE="package/release/intro-skipper-zh-CN-v${VERSION}.zip"
          python3 scripts/release.py manifest --archive "$ARCHIVE" --repository "$GITHUB_REPOSITORY"
          python3 -m json.tool manifest.json >/dev/null
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          printf '%s\n\n' "Intro Skipper 简体中文汉化版 ${VERSION}" '非官方社区构建，未使用官方 SignPath 签名。保留原 GUID、配置及检测逻辑。' > package/release-notes.md
          cat package/release/checksums.txt >> package/release-notes.md
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ARCHIVE" package/release/checksums.txt --draft --target "$GITHUB_SHA" --title "简体中文汉化版 v${VERSION}" --notes-file package/release-notes.md
          gh release edit "$TAG" --draft=false --latest
      - name: Publish catalog after release assets are available
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m "Publish Chinese plugin catalog v${VERSION}"
          git push origin HEAD:zh-CN-12.0
