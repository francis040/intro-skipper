name: Build and test
on:
  push:
    branches: [zh-CN-12.0]
  pull_request:
    branches: [zh-CN-12.0]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-build-env
      - name: Install official test FFmpeg
        run: |
          curl -fsSLO https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v8.1.3-1/jellyfin-ffmpeg8_8.1.3-1-noble_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./jellyfin-ffmpeg8_8.1.3-1-noble_amd64.deb
          sudo ln -sf /usr/lib/jellyfin-ffmpeg/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /usr/lib/jellyfin-ffmpeg/ffprobe /usr/local/bin/ffprobe
      - name: Frontend build and tests
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - name: Release build
        run: dotnet build IntroSkipper.sln -c Release --no-restore -p:SkipWebBuild=true
      - name: Official tests
        run: dotnet test IntroSkipper.sln -c Release --no-build --no-restore --logger "trx;LogFileName=official-tests.trx"
      - name: Validate localization and publishing scripts
        run: |
          node scripts/check-localization.mjs
          python3 scripts/test_release.py
      - name: Verify embedded resources and versions
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("IntroSkipper/IntroSkipper.csproj").findtext(".//FileVersion"))')
          dotnet run --file scripts/VerifyPlugin.cs -- IntroSkipper/bin/Release/net10.0/IntroSkipper.dll "$VERSION"
      - name: Package unsigned community build
        run: python3 scripts/release.py package
      - uses: actions/upload-artifact@v7
        with:
          name: intro-skipper-zh-CN
          path: package/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
